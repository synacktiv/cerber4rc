[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cerber4rc"
version = "1.0.0"
description = "Kerberos pre-authentication downgrade attack tool"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "scapy==2.7.0",
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "black"]

[project.scripts]
cerber4rc = "cerber4rc.cli:run"

[tool.setuptools.packages.find]
include = ["cerber4rc*"]
